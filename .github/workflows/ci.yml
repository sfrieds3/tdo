name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only: macOS runners bill at 10x on private repos; develop and test locally on macOS.
        os: [ubuntu-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-test the CLI
        shell: bash
        env:
          TDO_DB: ${{ runner.temp }}/tdo.db
          TDO_PROJECT: github.com/example/widgets
        run: |
          node src/bin.mjs add "smoke test !high #ci"
          node src/bin.mjs ls --json | node -e 'const items = JSON.parse(require("fs").readFileSync(0, "utf8")); if (items.length !== 1 || items[0].priority !== "high") process.exit(1)'
          node src/bin.mjs 'done' 1

  # Releases are versioned from commit messages, and PRs are squash-merged with the
  # PR title as the commit message, so titles must be conventional commits.
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
