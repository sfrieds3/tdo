name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN-created PR events require approval. Call CI directly instead,
  # then report on the exact PR commit (workflow_call keeps the caller's SHA).
  prepare-pr-ci:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.prepare.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: prepare
        env:
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        with:
          result-encoding: string
          script: |
            const { number } = JSON.parse(process.env.RELEASE_PR);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.ref !== 'release-please--branches--main--components--tdo' ||
                pr.user.login !== 'github-actions[bot]') {
              throw new Error('Refusing to run release CI for an unexpected pull request.');
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'Release PR CI',
              description: 'Testing release commit on Node 22, 24, and 26',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            return pr.head.sha;

  pr-ci:
    needs: prepare-pr-ci
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare-pr-ci.outputs.sha }}

  report-pr-ci:
    needs: [prepare-pr-ci, pr-ci]
    if: always() && needs.prepare-pr-ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.prepare-pr-ci.outputs.sha }}
          CI_RESULT: ${{ needs.pr-ci.result }}
        with:
          script: |
            const passed = process.env.CI_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.RELEASE_SHA,
              state: passed ? 'success' : 'failure',
              context: 'Release PR CI',
              description: passed ? 'Node 22, 24, and 26 checks passed' : `Release CI ${process.env.CI_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # Moving major and major.minor tags let Pi pin `git:github.com/sfrieds3/tdo@v0`
  # (or `@v0.1`) and still receive compatible releases on `pi update`.
  floating-tags:
    name: Update floating tags
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Move vMAJOR and vMAJOR.MINOR
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          for tag in "v$MAJOR" "v$MAJOR.$MINOR"; do
            git tag -f "$tag" "$TAG^{commit}"
            git push -f origin "refs/tags/$tag"
          done

  tarball:
    name: Attach package tarball
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tarball=$(npm pack --silent)
          gh release upload "$TAG" "$tarball" --clobber
